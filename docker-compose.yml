version: '3.8'

services:
  # ============================================================================
  # VICTIM SERVER (MÁY NẠN NHÂN)
  # - IP: 192.168.100.10
  # - Chạy Nginx trên cổng 80
  # - Cấp quyền NET_ADMIN & privileged: true để can thiệp iptables & sysctl
  # ============================================================================
  victim_server:
    build:
      context: .
      dockerfile: infrastructure/docker/victim/Dockerfile
    container_name: victim_server
    hostname: victim-server
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      isolated_net:
        ipv4_address: 192.168.100.10
    volumes:
      - ./defense:/workspace/defense
      - ./measurement:/workspace/measurement
    restart: unless-stopped

  # ============================================================================
  # ATTACKER NODE (MÁY KẺ TẤN CÔNG)
  # - IP: 192.168.100.20
  # - Cài sẵn hping3, python3, scapy, iputils-ping
  # - Cấp quyền NET_RAW & NET_ADMIN để phát sinh raw socket & giả mạo IP
  # ============================================================================
  attacker_node:
    build:
      context: .
      dockerfile: infrastructure/docker/attacker/Dockerfile
    container_name: attacker_node
    hostname: attacker-node
    privileged: true
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      isolated_net:
        ipv4_address: 192.168.100.20
    volumes:
      - ./attacks:/workspace/attacks
      - ./measurement:/workspace/measurement
    stdin_open: true
    tty: true
    restart: unless-stopped

  # ============================================================================
  # NORMAL CLIENT (NGƯỜI DÙNG HỢP LỆ)
  # - IP: 192.168.100.30
  # - Cài sẵn curl, python3 để đo lường độ trễ (latency) và tỷ lệ lỗi (FR5)
  # ============================================================================
  normal_client:
    build:
      context: .
      dockerfile: infrastructure/docker/client/Dockerfile
    container_name: normal_client
    hostname: normal-client
    networks:
      isolated_net:
        ipv4_address: 192.168.100.30
    volumes:
      - ./measurement:/workspace/measurement
    stdin_open: true
    tty: true
    restart: unless-stopped

# ==============================================================================
# MẠNG NỘI BỘ CÔ LẬP HOÀN TOÀN (ISOLATED INTERNAL BRIDGE NETWORK)
# - Subnet: 192.168.100.0/24 (Tuyệt đối không dùng host network)
# ==============================================================================
networks:
  isolated_net:
    name: isolated_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24
          gateway: 192.168.100.1
